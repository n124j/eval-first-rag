[project]
name = "eval-first-rag"
version = "0.1.0"
description = "Eval-first retrieval-augmented generation, free and local"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "httpx==0.28.1",
    "fastapi==0.150.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "PyYAML==6.0.3", "ruff==0.17.1"]

[project.scripts]
evalrag = "evalrag.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
