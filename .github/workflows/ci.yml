name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m ruff check .
      - run: python -m pytest -q
      - name: Ingest the corpus from recorded embeddings
        run: >-
          python -m evalrag ingest --corpus corpus
          --replay-embeddings evals/recordings/embeddings.npz
          --data-dir "${{ runner.temp }}/evalrag-data"
      - name: Replay the golden set from recorded responses
        run: >-
          python -m evalrag eval --golden evals/golden/golden.jsonl --corpus corpus
          --data-dir "${{ runner.temp }}/evalrag-data"
          --replay-llm evals/recordings/llm.jsonl
          --replay-embeddings evals/recordings/embeddings.npz
          --report-out "${{ runner.temp }}/ci-report.md"
          --metrics-out "${{ runner.temp }}/ci-metrics.json"
          --model qwen2.5-7b-instruct-1m
          --hardware "replayed from recordings in CI"
          --date 2026-10-20
      - name: Gate the metrics against the baseline
        run: >-
          python -m evalrag gate --metrics "${{ runner.temp }}/ci-metrics.json"
          --baseline evals/baseline.json
      - name: Upload the eval report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-report
          path: |
            ${{ runner.temp }}/ci-report.md
            ${{ runner.temp }}/ci-metrics.json
          retention-days: 14
      - run: python -m tools.hygiene
      - run: python -m tools.role_paths --base ${{ github.event.pull_request.base.sha || github.event.before }} --head ${{ github.sha }}

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action's default (8.24.3) ignores the [[allowlists]] tables in .gitleaks.toml.
          GITLEAKS_VERSION: 8.30.1
